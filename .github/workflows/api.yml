name: API

# A pull request runs this group only when it changes one of these files, and a push to main
# runs it through main.yml (docs/learn/53). If a test or a step starts to read another file,
# add the file here: test_ci_workflows.py checks the files that the tests read today.
on:
  pull_request:
    # The tests of the API read the stack files, the guide, the schema of the feed and the files of
    # CI; the contract check reads the generated types and needs pnpm. Ruff and the build of the
    # package skip each file that the .gitignore of the root names. The tests of the folder keys/
    # read its guide, and the tests of keys/ and of the build context read .dockerignore.
    paths:
      - apps/api/**
      - packages/api-client/**
      - packages/site-search/**
      - deploy/**
      - compose.yaml
      - compose.prod.yaml
      - .dockerignore
      - docs/quickstart.md
      - .env.example
      - .gitignore
      - keys/README.md
      - Makefile
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/**
  workflow_call:

# The group name has its own prefix: in a called workflow, github.workflow names the caller.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.9.3"
  NODE_VERSION: "24"

jobs:
  api:
    name: API (lint, types, tests, contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: unshelve
          POSTGRES_PASSWORD: unshelve
          POSTGRES_DB: unshelve
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U unshelve -d unshelve"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - id: sync
        run: uv sync --locked
      # The gate of main.yml follows the rules of the API code (.github/scripts/ruff.toml).
      - run: uv run ruff check . ../../.github/scripts
      - run: uv run ruff format --check . ../../.github/scripts
      # main.yml runs the gate only with its lock. A change of the dependencies of the gate without
      # a new lock (uv lock --script) fails here, not on main.
      - run: uv lock --check --script ../../.github/scripts/ci_gate.py
      - run: uv run pyright
      - run: uv run pytest
      # The API contract: openapi.json and the generated types must match the code. These steps
      # run also after a failed check above, so that one run reports both.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: pnpm
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: The API contract is up to date
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        working-directory: .
        run: make openapi-check
      # actionlint checks the expressions of the workflows, and shellcheck their run blocks. A
      # step, not a job: a job bills at least one more minute.
      - name: Lint the workflows
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          LINT: rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$LINT" -color
