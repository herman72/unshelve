name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.3"
  NODE_VERSION: "24"

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: unshelve
          POSTGRES_PASSWORD: unshelve
          POSTGRES_DB: unshelve
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U unshelve -d unshelve"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      # Node runs these tests on the TypeScript files themselves: no build step.
      - run: pnpm --filter @unshelve/site-search test
      - run: pnpm -r build

  web-e2e:
    name: Web (end-to-end, against a pretend API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright drives the Google Chrome of the runner (channel "chrome"): no browser to
      # download. The config builds the app for the pretend API and starts both.
      - run: pnpm --filter @unshelve/web test:e2e

  site-example:
    name: Example site (end-to-end, the search of the feed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The config builds examples/site for production, as a site that uses the package would
      # be built, and searches it in the Google Chrome of the runner.
      - run: pnpm --filter @unshelve/example-site test:e2e

  web-dev:
    name: Web (each page under next dev, against a pretend API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # next dev logs errors that the production build of web-e2e cannot show, for example a
      # clock read in a stage of the render that a prerender would see. The spec fails on each
      # route error in its log and on each error in the browser console.
      - run: pnpm --filter @unshelve/web test:dev
      - name: Log of next dev
        if: failure()
        run: cat apps/web/test-results/next-dev.log

  contract:
    name: API contract is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make openapi-check

  # Both jobs run the marked blocks of docs/quickstart.md on this fresh checkout, as written
  # there: a change of the guide is tested, and a step that stops working fails here.
  quickstart-local:
    name: Quickstart on this computer (docs/quickstart.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The steps of the guide
        run: bash -euxo pipefail -c "$(deploy/quickstart-steps.sh quickstart-local)"
      - name: The check of the guide
        run: bash -euxo pipefail -c "$(deploy/quickstart-steps.sh quickstart-local-check)"
      # The service makes its first backup by itself at the start: wait for it, so that the
      # backup of the guide is the second one. No sudo: the service, which runs as root, gives
      # the files to the owner of the folder, and the guide made the folder as this user.
      - name: The first backup, by the service itself
        run: timeout 120 bash -c 'until find backups/db -mindepth 2 -name SHA256SUMS 2>/dev/null | grep -q .; do sleep 2; done'
      # Rows of each kind and files, so that the backup of the guide has something to restore.
      - name: Data for the backup (an import of a made-up export with files)
        run: deploy/backup/drill-data.sh
      - name: The backup of the guide
        run: bash -euxo pipefail -c "$(deploy/quickstart-steps.sh quickstart-backup)"
      - name: Two complete backups that this user can read, and the service is healthy
        run: |
          docker compose exec -T backup bash /deploy/backup/backup.sh health
          test "$(find backups/db -mindepth 2 -name SHA256SUMS | wc -l)" -eq 2
          test -z "$(find backups ! -user "$(id -u)")"
          # The backup of the guide, with the data: the name that the restore of the guide uses.
          docker compose run --rm -T restore list | tee "$RUNNER_TEMP/backups"
          tail -n 1 "$RUNNER_TEMP/backups" | grep -v $'\t0 items'
          echo "NAME=$(tail -n 1 "$RUNNER_TEMP/backups" | cut -f1)" >> "$GITHUB_ENV"
      - name: The drill of the guide, beside the running stack
        run: bash -euxo pipefail -c "$(deploy/quickstart-steps.sh quickstart-drill)"
      - name: A drill refuses a backup with a damaged file, and changes nothing
        run: |
          cp -R backups "$RUNNER_TEMP/broken"
          file=$(find "$RUNNER_TEMP/broken/blobs" -type f | head -n 1)
          python3 -c 'import sys; p = sys.argv[1]; b = bytearray(open(p, "rb").read()); b[0] ^= 1; open(p, "wb").write(b)' "$file"
          if UNSHELVE_BACKUP_DIR="$RUNNER_TEMP/broken" deploy/backup/drill.sh >"$RUNNER_TEMP/drill.out" 2>&1; then
            cat "$RUNNER_TEMP/drill.out"
            exit 1
          fi
          grep "not ok: blob $(basename "$file")" "$RUNNER_TEMP/drill.out"
      - name: The copy of the guide
        run: bash -euxo pipefail -c "$(deploy/quickstart-steps.sh quickstart-export)"
      # A new computer: no volume, no backups folder, and a new password for the database.
      - name: A new computer
        run: |
          docker compose down --volumes
          rm -rf backups
          echo "UNSHELVE_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
      - name: The restore of the guide
        run: |
          bash -euxo pipefail -c "$(deploy/quickstart-steps.sh quickstart-restore-files)"
          test "$(tar -tf ~/unshelve-backup.tar | sed -n 1p)" = "db/$NAME/"
          bash -euxo pipefail -c "$(deploy/quickstart-steps.sh quickstart-restore-test)"
          bash -euxo pipefail -c "$(deploy/quickstart-steps.sh quickstart-restore)"
      # The data check of the restore compared each fact before the start. After it, the worker
      # goes on with the jobs that were pending in the backup, so the rows can only grow.
      - name: The restored instance signs in, and has at least the rows of the backup
        run: |
          bash -euxo pipefail -c "$(deploy/quickstart-steps.sh quickstart-local-check)"
          for table in items assets; do
            backup=$(awk -F'\t' -v key="$table" '$1 == key { print $2 }' "backups/db/$NAME/info.txt")
            now=$(docker compose exec -T db psql -U unshelve -d unshelve -At -c "SELECT count(*) FROM $table")
            echo "$table: $backup in the backup, $now now"
            test "$backup" -gt 0
            test "$now" -ge "$backup"
          done
          docker compose exec -T backup bash /deploy/backup/backup.sh health
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down --volumes
        if: always()
      - run: docker compose -p unshelve-drill down --volumes
        if: always()

  quickstart-server:
    name: Quickstart on a server (docs/quickstart.md, Caddy and HTTPS for localhost)
    runs-on: ubuntu-latest
    env:
      # The two values of step 2. For "localhost", Caddy makes the certificate with its own
      # local authority, as no public authority signs that name.
      DOMAIN: localhost
      OWNER_TELEGRAM_ID: "4242"
    steps:
      - uses: actions/checkout@v7
      - name: The steps of the guide
        run: bash -euxo pipefail -c "$(deploy/quickstart-steps.sh quickstart-server)"
      - name: Trust the local authority of Caddy, as the browser of the owner would
        run: docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"
      - name: The check of the guide
        env:
          CURL_CA_BUNDLE: ${{ runner.temp }}/caddy-root.crt
        run: bash -euxo pipefail -c "$(deploy/quickstart-steps.sh quickstart-server-check)"
      - name: No port but those of Caddy is open
        run: |
          for port in 3000 8000 54329; do
            if (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null; then
              echo "port $port is open"
              exit 1
            fi
          done
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down --volumes
        if: always()
