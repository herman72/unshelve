name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.3"
  NODE_VERSION: "24"

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: unshelve
          POSTGRES_PASSWORD: unshelve
          POSTGRES_DB: unshelve
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U unshelve -d unshelve"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      # Node runs these tests on the TypeScript files themselves: no build step.
      - run: pnpm --filter @unshelve/site-search test
      - run: pnpm -r build

  web-e2e:
    name: Web (end-to-end, against a pretend API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright drives the Google Chrome of the runner (channel "chrome"): no browser to
      # download. The config builds the app for the pretend API and starts both.
      - run: pnpm --filter @unshelve/web test:e2e

  site-example:
    name: Example site (end-to-end, the search of the feed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The config builds examples/site for production, as a site that uses the package would
      # be built, and searches it in the Google Chrome of the runner.
      - run: pnpm --filter @unshelve/example-site test:e2e

  web-dev:
    name: Web (each page under next dev, against a pretend API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # next dev logs errors that the production build of web-e2e cannot show, for example a
      # clock read in a stage of the render that a prerender would see. The spec fails on each
      # route error in its log and on each error in the browser console.
      - run: pnpm --filter @unshelve/web test:dev
      - name: Log of next dev
        if: failure()
        run: cat apps/web/test-results/next-dev.log

  contract:
    name: API contract is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make openapi-check

  # Both jobs run the marked blocks of docs/quickstart.md on this fresh checkout, as written
  # there: a change of the guide is tested, and a step that stops working fails here.
  quickstart-local:
    name: Quickstart on this computer (docs/quickstart.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The steps of the guide
        run: deploy/quickstart-steps.sh quickstart-local | bash -euxo pipefail
      - name: The check of the guide
        run: deploy/quickstart-steps.sh quickstart-local-check | bash -euxo pipefail
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down --volumes
        if: always()

  quickstart-server:
    name: Quickstart on a server (docs/quickstart.md, Caddy and HTTPS for localhost)
    runs-on: ubuntu-latest
    env:
      # The two values of step 2. For "localhost", Caddy makes the certificate with its own
      # local authority, as no public authority signs that name.
      DOMAIN: localhost
      OWNER_TELEGRAM_ID: "4242"
    steps:
      - uses: actions/checkout@v7
      - name: The steps of the guide
        run: deploy/quickstart-steps.sh quickstart-server | bash -euxo pipefail
      - name: Trust the local authority of Caddy, as the browser of the owner would
        run: docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"
      - name: The check of the guide
        env:
          CURL_CA_BUNDLE: ${{ runner.temp }}/caddy-root.crt
        run: deploy/quickstart-steps.sh quickstart-server-check | bash -euxo pipefail
      - name: No port but those of Caddy is open
        run: |
          for port in 3000 8000 54329; do
            if (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null; then
              echo "port $port is open"
              exit 1
            fi
          done
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down --volumes
        if: always()
