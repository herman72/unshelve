# Alembic configuration. The database URL comes from UNSHELVE_DATABASE_URL (see migrations/env.py).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# Revisions are numbered by hand: `alembic revision --rev-id 0002 -m "add thing"` -> 0002_add_thing.py
file_template = %%(rev)s_%%(slug)s
