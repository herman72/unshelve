[project]
name = "unshelve"
version = "0.1.0"
description = "A goal-aware reading inbox: API, worker and Telegram bot"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "M. Sherafati" }]
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "idna>=3.10",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "selectolax>=0.4",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
unshelve = "unshelve.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unshelve"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",  # pycodestyle, pyflakes
  "I",            # import order
  "B",            # likely bugs
  "UP",           # modern syntax
  "N",            # naming
  "S",            # security
  "ASYNC",        # async pitfalls
  "DTZ",          # naive datetimes
  "C4", "SIM", "RET", "PTH", "PT", "T20", "TID", "RUF",
]
ignore = [
  "B008",  # FastAPI and Typer use calls as argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works
"src/unshelve/testing/conformance.py" = ["S101"]  # shared test suites
"migrations/versions/*" = ["E501"]  # long SQL expressions are kept on one line

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests", "migrations"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "db: needs a running Postgres (make db)",
  "live: needs real credentials; never runs in CI",
  "slow: waits for a real timeout (about 2 s)",
]
