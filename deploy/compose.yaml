# The whole stack. From the repository root: `docker compose up -d --build --wait`.
# Ports are bound to 127.0.0.1 only. Nothing here needs an inbound connection from the internet.
name: unshelve

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile.api
  image: unshelve-api:dev
  env_file:
    - path: ../.env
      required: false
  environment:
    UNSHELVE_DATABASE_URL: postgresql+psycopg://unshelve:${UNSHELVE_DB_PASSWORD:-unshelve}@db:5432/unshelve
    UNSHELVE_LOG_JSON: "true"
  restart: unless-stopped

# The database and its backups use one image, so pg_dump always has the version of the server.
# Each service merges this mapping (<<): Dependabot updates the image on this line, but not an
# image behind an alias (image: *name). The digest fixes the content of the tag.
x-postgres: &postgres
  image: pgvector/pgvector:0.8.7-pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8

services:
  db:
    <<: *postgres
    environment:
      POSTGRES_USER: unshelve
      POSTGRES_PASSWORD: ${UNSHELVE_DB_PASSWORD:-unshelve}
      POSTGRES_DB: unshelve
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${UNSHELVE_DB_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unshelve -d unshelve"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["unshelve", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["unshelve", "api", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${UNSHELVE_API_PORT:-8000}:8000"
    volumes:
      # Exports of Telegram chats, for `unshelve import /imports/<folder>`. Read only.
      - ../exports:/imports:ro
      # The files that you send: the worker keeps them, and the web app will show them.
      - blobs:/app/var/blobs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/readyz', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    <<: *app
    command: ["unshelve", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      # The files that you send, under the SHA-256 of their bytes (FileBlobStore).
      - blobs:/app/var/blobs

  bot:
    <<: *app
    command: ["unshelve", "bot"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # A backup of the database and of the files when the newest one is older than a day
  # (docs/learn/50). The backups go to a folder of this computer, not into a Docker volume,
  # so that `docker compose down --volumes` cannot delete them.
  backup:
    <<: *postgres
    command: ["bash", "/deploy/backup/backup.sh", "loop"]
    environment:
      - PGHOST=db
      - PGUSER=unshelve
      - PGDATABASE=unshelve
      # No env_file: this service gets the password of the database, by its name from .env,
      # and no other secret.
      - UNSHELVE_DB_PASSWORD
      - UNSHELVE_BACKUP_EVERY_HOURS=${UNSHELVE_BACKUP_EVERY_HOURS:-24}
      - UNSHELVE_BACKUP_KEEP_DAILY=${UNSHELVE_BACKUP_KEEP_DAILY:-7}
      - UNSHELVE_BACKUP_KEEP_WEEKLY=${UNSHELVE_BACKUP_KEEP_WEEKLY:-6}
      - UNSHELVE_BACKUP_RETRY_MINUTES=${UNSHELVE_BACKUP_RETRY_MINUTES:-60}
    volumes:
      - ./backup:/deploy/backup:ro
      - blobs:/var/lib/unshelve/blobs:ro
      - ${UNSHELVE_BACKUP_DIR:-../backups}:/backups
      - backup-status:/var/lib/unshelve/backup-status
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "/deploy/backup/backup.sh", "health"]
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 20s
      start_interval: 2s
    # A stop waits for a dump that runs, and the backup then removes its unfinished part.
    stop_grace_period: 2m
    restart: unless-stopped

  # The restore of a backup into an empty instance (docs/learn/50, docs/quickstart.md). Only
  # `docker compose run --rm restore NAME|latest` starts it; `run --rm restore` lists the backups.
  restore:
    <<: *postgres
    profiles: ["restore"]
    entrypoint: ["bash", "/deploy/backup/restore.sh"]
    command: ["list"]
    environment:
      - PGHOST=db
      - PGUSER=unshelve
      - PGDATABASE=unshelve
      # As for the backup: the password of the database, and no other secret.
      - UNSHELVE_DB_PASSWORD
      # The user of the app in Dockerfile.api: the restored files must be its files.
      - UNSHELVE_APP_UID=10001
    volumes:
      - ./backup:/deploy/backup:ro
      # The revisions that this checkout knows: a backup from newer code is refused.
      - ../apps/api/migrations/versions:/deploy/migrations:ro
      - ${UNSHELVE_BACKUP_DIR:-../backups}:/backups:ro
      - blobs:/var/lib/unshelve/blobs
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: unshelve-web:dev
    environment:
      UNSHELVE_API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${UNSHELVE_WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  db-data:
  blobs:
  backup-status:
